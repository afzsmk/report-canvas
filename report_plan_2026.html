<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Анализ перспективного плана — 18.09.2026</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Inter,Segoe UI,Arial,sans-serif;background:#07101d;color:#e5edf7}
header{position:sticky;top:0;z-index:10;background:rgba(7,16,29,.96);border-bottom:1px solid #1e293b;backdrop-filter:blur(12px)}
.wrap{max-width:1280px;margin:auto;padding:20px}
.kicker{font-size:11px;text-transform:uppercase;letter-spacing:.2em;color:#38bdf8;font-weight:800}
h1{font-size:26px;margin:7px 0 3px}.muted{color:#94a3b8;font-size:14px}.top{display:flex;justify-content:space-between;align-items:center;gap:16px}
a,.btn{color:#e5edf7;text-decoration:none;background:#17263a;border:1px solid #26374e;border-radius:10px;padding:10px 14px;font-size:13px}
.card{background:rgba(15,27,45,.9);border:1px solid rgba(148,163,184,.15);border-radius:18px;padding:18px}
.viewer{margin-top:22px}.toolbar{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.controls{display:flex;align-items:center;gap:8px}.btn{cursor:pointer}.btn:disabled{opacity:.4;cursor:default}
#pages{display:flex;flex-direction:column;gap:18px}.page{background:#0b1626;border:1px solid #20334d;border-radius:16px;padding:12px}
.pagehead{display:flex;justify-content:space-between;margin:0 3px 10px;color:#94a3b8;font-size:12px}.page canvas{display:block;width:100%;height:auto;background:white;border-radius:10px}
.status{color:#7dd3fc}.error{color:#fca5a5}
</style>
</head>
<body>
<header><div class="wrap top"><div><div class="kicker">ЗСМК · главный технолог</div><h1>Анализ перспективного плана</h1><div class="muted">по состоянию на 18.09.2026</div></div><a href="index.html">← Все отчёты</a></div></header>
<main class="wrap">
<section class="card viewer">
<div class="toolbar">
<div><b>Исходный документ</b><div id="status" class="muted">Загрузка PDF…</div></div>
<div class="controls"><button id="prev" class="btn">← Назад</button><span id="counter" class="muted">— / —</span><button id="next" class="btn">Вперёд →</button><a id="open" target="_blank" href="Анализ%20перспективного%20плана%20по%20состоянию%20на%2018.09.2026.pdf">Открыть PDF ↗</a></div>
</div>
<div id="pages"></div>
</section>
</main>
<script>
const FILE='Анализ перспективного плана по состоянию на 18.09.2026.pdf';
let pdf=null,current=1;
const pages=document.getElementById('pages'),status=document.getElementById('status'),counter=document.getElementById('counter');
async function renderPage(n){
 if(!pdf)return; current=Math.max(1,Math.min(n,pdf.numPages)); pages.innerHTML='';
 const page=await pdf.getPage(current),vp=page.getViewport({scale:1.45});
 const box=document.createElement('div');box.className='page';
 const head=document.createElement('div');head.className='pagehead';head.innerHTML='<span>Исходный PDF</span><span>Страница '+current+' из '+pdf.numPages+'</span>';
 const canvas=document.createElement('canvas');canvas.width=vp.width;canvas.height=vp.height;
 box.append(head,canvas);pages.appendChild(box);
 await page.render({canvasContext:canvas.getContext('2d'),viewport:vp}).promise;
 counter.textContent=current+' / '+pdf.numPages;
 document.getElementById('prev').disabled=current===1;document.getElementById('next').disabled=current===pdf.numPages;
}
async function init(){try{pdf=await pdfjsLib.getDocument(encodeURI(FILE)).promise;status.innerHTML='<span class="status">✓ '+pdf.numPages+' страниц</span>';await renderPage(1)}catch(e){status.innerHTML='<span class="error">Не удалось загрузить PDF</span>';console.error(e)}}
document.getElementById('prev').onclick=()=>renderPage(current-1);document.getElementById('next').onclick=()=>renderPage(current+1);init();
</script>
</body></html>

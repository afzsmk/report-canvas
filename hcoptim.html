<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Оптимизация параметров сотового заполнителя</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Inter,Segoe UI,Arial,sans-serif;background:#07101d;color:#e5edf7}
header{position:sticky;top:0;z-index:10;background:rgba(7,16,29,.96);border-bottom:1px solid #1e293b;backdrop-filter:blur(12px)}
.wrap{max-width:1280px;margin:auto;padding:20px}.top{display:flex;justify-content:space-between;align-items:center;gap:16px}
.kicker{font-size:11px;text-transform:uppercase;letter-spacing:.2em;color:#38bdf8;font-weight:800}
h1{font-size:26px;margin:7px 0 3px}.muted{color:#94a3b8;font-size:14px}
a{color:#e5edf7;text-decoration:none;background:#17263a;border:1px solid #26374e;border-radius:10px;padding:10px 14px;font-size:13px}
.card{margin-top:22px;background:rgba(15,27,45,.9);border:1px solid rgba(148,163,184,.15);border-radius:18px;padding:18px}
.toolbar{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.status{color:#7dd3fc}.error{color:#fca5a5}
iframe{display:block;width:100%;height:calc(100vh - 205px);min-height:650px;border:0;border-radius:12px;background:#111827}
</style>
</head>
<body>
<header><div class="wrap top"><div><div class="kicker">ЗСМК · главный технолог</div><h1>Оптимизация параметров сотового заполнителя</h1><div class="muted">Анализ соты</div></div><a href="index.html">← Все отчёты</a></div></header>
<main class="wrap">
<section class="card">
<div class="toolbar"><div><b>Исходный документ</b><div class="muted">Постраничный просмотр PDF</div></div><a target="_blank" href="https://drive.google.com/file/d/1ObsT1vMKBgYOe5YSlneUpPuXbRYg-UP_/preview">Открыть PDF ↗</a></div>
<iframe src="https://drive.google.com/file/d/1ObsT1vMKBgYOe5YSlneUpPuXbRYg-UP_/preview" allow="autoplay"></iframe>
</section>
</main>
</body></html>
